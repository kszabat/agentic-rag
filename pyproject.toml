[project]
name = "agentic-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "kszabat", email = "krystian.szabat@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "colpali-engine>=0.3.18",
    "docling>=2.126.0",
    "llama-index>=0.14.24",
    "llama-index-core>=0.14.24",
    "llama-index-llms-google-genai>=0.11.1",
    "llama-index-node-parser-docling>=0.5.0",
    "llama-index-readers-docling>=0.5.0",
    "llama-index-vector-stores-qdrant>=0.10.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdfium2>=5.13.0",
    "qdrant-client>=1.19.0",
    "typer>=0.26.8",
]

[project.scripts]
agentic-rag = "agentic_rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]
